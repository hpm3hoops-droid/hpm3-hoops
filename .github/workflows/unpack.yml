name: Unpack source bundle
on:
  push:
    branches: [main]
    paths: ['bootstrap/app.b64']
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract sources
        run: |
          set -e
          tr -d '\n\r ' < bootstrap/app.b64 | base64 -d > /tmp/app.tgz
          tar -xzf /tmp/app.tgz -C .
          rm -rf bootstrap .github/workflows/unpack.yml
          ls -la
      - name: Commit sources
        run: |
          git config user.name 'hpm3hoops-droid'
          git config user.email 'hpm3hoops-droid@users.noreply.github.com'
          git add -A
          git commit -m 'Add HPM3 Hoops app sources'
          git push
